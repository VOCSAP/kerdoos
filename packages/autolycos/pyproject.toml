[project]
name = "autolycos"
version = "0.1.0"
description = "Anti-bot fetching subsystem: escalating Fetcher tiers (http/tls/browser/uc) behind a stable port, with fail-closed SSRF guards. Domain-agnostic: the caller injects a DomainPolicy."
requires-python = ">=3.11"
dependencies = [
    # Floor is 2.34 (matches the tested 2.34.2), NOT 2.31: the http tier's IP
    # pin (adapters/http._PinnedHTTPAdapter) overrides
    # HTTPAdapter.build_connection_pool_key_attributes, an API introduced in
    # requests 2.32.0. On <2.32 that method does not exist, the parent never
    # calls the override, and the SSRF IP pin would silently vanish (CWE-918).
    "requests>=2.34",
]

[project.optional-dependencies]
# patchright (drop-in playwright fork) launches an undetected Chromium (deep
# launch-time patches, Kleos #11050); playwright-stealth layers JS-level
# evasion on each page. The vanilla playwright dep is intentionally dropped
# here -- patchright provides the same sync_api surface (Phase 2b).
browser = ["patchright>=1.49", "playwright-stealth>=2.0"]
tls = ["curl_cffi>=0.7"]
# psutil kills any chromedriver/Chrome process left behind when a uc launch
# is abandoned at UC_LAUNCH_TIMEOUT_SECONDS (roadmap 65cef071) -- required,
# not optional cleanup, since it runs on every uc fetch's launch path.
uc = ["seleniumbase>=4.24", "psutil>=5.9"]

[dependency-groups]
# seleniumbase's own chromium_arg parsing is exercisable without a real
# Chrome/Chromium binary, so it belongs in dev (every local/CI run), not
# behind the "uc" extra (which the autonomous image installs for the actual
# browser launch). psutil is needed alongside it for the launch-deadline
# unit tests, which use a fake (non-Chrome) Driver and so also run locally.
dev = ["seleniumbase>=4.24", "psutil>=5.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolycos"]
