[project]
name = "kerdoos"
version = "0.1.0"
description = "Kerdoos application: core orchestrator, registry, persistence, parsers, digest, interfaces (CLI/web). Depends on autolycos for anti-bot fetching."
requires-python = ">=3.11"
dependencies = [
    "autolycos",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    # Server-rendered WebUI (Phase 4b): Jinja2 templates + HTML form parsing.
    # jinja2 backs fastapi.templating.Jinja2Templates; python-multipart is
    # required by Starlette to parse application/x-www-form-urlencoded POSTs
    # (the HTML login + write forms). Buildless: no bundler, no JS toolchain.
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Argon2id password hashing (Phase 3 auth). argon2-cffi is the reference
    # binding; used for owner passwords + the anti-enumeration dummy verify.
    "argon2-cffi>=23.1",
    # Cron evaluation (Phase 6b, ADR 0003 Decision 2/Q-b) + IANA tz database
    # (zoneinfo is stdlib 3.9+ but ships no data on slim images).
    "croniter>=2.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
web = ["uvicorn[standard]>=0.30"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv.sources]
autolycos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerdoos"]
