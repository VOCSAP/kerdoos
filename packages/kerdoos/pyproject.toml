[project]
name = "kerdoos"
version = "0.1.0"
description = "Kerdoos application: core orchestrator, registry, persistence, parsers, digest, interfaces (CLI/web). Depends on autolycos for anti-bot fetching."
requires-python = ">=3.11"
dependencies = [
    "autolycos",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    # Server-rendered WebUI (Phase 4b): Jinja2 templates + HTML form parsing.
    # jinja2 backs fastapi.templating.Jinja2Templates; python-multipart is
    # required by Starlette to parse application/x-www-form-urlencoded POSTs
    # (the HTML login + write forms). Buildless: no bundler, no JS toolchain.
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # Argon2id password hashing (Phase 3 auth). argon2-cffi is the reference
    # binding; used for owner passwords + the anti-enumeration dummy verify.
    "argon2-cffi>=23.1",
    # Cron evaluation (Phase 6b, ADR 0003 Decision 2/Q-b) + IANA tz database
    # (zoneinfo is stdlib 3.9+ but ships no data on slim images).
    "croniter>=2.0",
    "tzdata>=2024.1",
    # MCP server mounted in the WebUI app (Phase 5, ADR 0005): official SDK
    # v2 (`MCPServer`), not the third-party `fastmcp` package.
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
web = ["uvicorn[standard]>=0.30"]

[dependency-groups]
# uvicorn is in the `web` extra for runtime, and ALSO here: the Dockerfile
# CMD's proxy-header tests drive uvicorn's own CLI parser and Config wiring
# to resolve a client address. Without it in the dev group they skip, and a
# skip in a suite that already has 27 of them is indistinguishable from a
# pass -- the guard would be unprotected in exactly the environment the
# contributing docs tell a developer to use.
dev = ["pytest>=8.0", "httpx>=0.27", "uvicorn>=0.30"]

# Makes `kerdoos digest` / `kerdoos run` / `kerdoos config ...` resolve to a
# real executable (uv/pip install puts it on PATH) instead of only being
# reachable via `python -m kerdoos.interfaces.cli.main`. Required for the
# workers>1 + external-cron topology (ADR 0002 Decision 1) to actually be
# runnable as documented.
[project.scripts]
kerdoos = "kerdoos.interfaces.cli.main:main"

[tool.uv.sources]
autolycos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerdoos"]
