{% extends "base.html" %}
{% block title %}Connexion -- Kerdoos{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth__panel">
    <div class="auth__brand">Kerdoos</div>
    <p class="auth__hint">Poste de veille prix et disponibilité.</p>

    {% if error %}
    <div class="banner banner--error" role="alert">Identifiants invalides.</div>
    {% endif %}

    <form method="post" action="/auth/login" novalidate>
      <div class="field">
        <label class="field__label" for="identifier">Identifiant ou email</label>
        <input class="input" id="identifier" name="identifier" type="text"
               autocomplete="username" autofocus required
               value="{{ identifier or '' }}">
      </div>
      <div class="field">
        <label class="field__label" for="password">Mot de passe</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <div class="form-actions">
        <button class="btn btn--primary" type="submit">Se connecter</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
