# Site registry -- fetcher tier + parser locator per site.
# Parser specs are pure locators; value interpretation lives in the adapter.
sites:
  kabum:
    fetcher: http
    domain: kabum.com.br
    parser:
      kind: statejson
      # Kabum is a Next.js app; prices live in __NEXT_DATA__ as REAIS floats.
      pix: props.pageProps.product.prices.priceWithDiscount   # PIX / a-vista
      card: props.pageProps.product.prices.price              # card / base
      availability: props.pageProps.product.available         # bool -> In/OutOfStock
  amazon:
    fetcher: tls               # fingerprint-impersonating tier (Akamai gate)
    domain: amazon.com.br
    tier2_label: Prime         # label for the membership-gated price tier
    parser:
      # Amazon's two-tier accordion is parsed by a dedicated adapter; the DOM
      # anchors are fixed in the adapter, so no locators are authored here.
      kind: amazon
  mercadolivre:
    fetcher: camoufox          # no tier rendered the product page when last measured; camoufox
                               # is kept by operator decision (ADR 0004 Decision 1 amendment)
    domain: mercadolivre.com.br
    # Source URLs must use www.mercadolivre.com.br: mercadolivre.com.br and
    # produto.mercadolivre.com.br redirect there, and the camoufox tier refuses
    # a page whose final host differs.
    # Render-critical CDN: ML is a full client-side render whose price and
    # availability are injected by the http2.mlstatic.com JS bundle. Allow it as
    # a browser SUB-RESOURCE only (never a navigation target) so the page can
    # hydrate; without it the micro-landing shell never becomes the product page.
    subresource_domains:
      - http2.mlstatic.com
    parser:
      # MercadoLivre's rendered DOM is parsed by a dedicated adapter (single
      # price from <meta itemprop="price"> under id="price"); no locators here.
      kind: mercadolivre
  terabyte:
    fetcher: tls               # SSR prices; curl_cffi tier (Cloudflare passive)
    domain: terabyteshop.com.br
    parser:
      # Terabyte server-renders both prices; a dedicated adapter reads #valVista
      # (pix) and #valParc (card), skipping duplicated empty/placeholder ids.
      kind: terabyte
  pichau:
    fetcher: tls               # SSR flight in the doc; curl_cffi tier (CF passive)
    domain: pichau.com.br
    parser:
      # Pichau server-renders the pichau_prices RSC flight; a dedicated adapter
      # reads .avista (pix) and .final_price (card), ignoring the JSON-LD (whose
      # price is the card price) and base_price (reference).
      kind: pichau
  magalu:
    fetcher: camoufox          # Akamai Bot Manager blocks the Chromium tiers in a container
    domain: magazineluiza.com.br
    # Source URLs must use www.magazineluiza.com.br: the bare host redirects
    # there, and the camoufox tier refuses a page whose final host differs.
    # mlcdn.com.br serves Magalu's JS/asset bundles (wx./a-static. subdomains),
    # allowed as sub-resources through the egress proxy.
    subresource_domains:
      - mlcdn.com.br
    parser:
      # Magalu renders __NEXT_DATA__ props.pageProps.data.item.offers[0]; a
      # dedicated adapter reads bestPrice.totalAmount (pix) and price (card).
      kind: magalu
