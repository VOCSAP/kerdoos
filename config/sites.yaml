# Site registry -- fetcher tier + parser locator per site.
# Parser specs are pure locators; value interpretation lives in the adapter.
sites:
  kabum:
    fetcher: http
    parser:
      kind: statejson
      # Kabum is a Next.js app; prices live in __NEXT_DATA__ as REAIS floats.
      pix: props.pageProps.product.prices.priceWithDiscount   # PIX / a-vista
      card: props.pageProps.product.prices.price              # card / base
      availability: props.pageProps.product.available         # bool -> In/OutOfStock
  amazon:
    fetcher: tls               # fingerprint-impersonating tier (Akamai gate)
    tier2_label: Prime         # label for the membership-gated price tier
    parser:
      # Amazon's two-tier accordion is parsed by a dedicated adapter; the DOM
      # anchors are fixed in the adapter, so no locators are authored here.
      kind: amazon
  mercadolivre:
    fetcher: browser           # SPA; price injected by client-side JS (Chromium)
    # Render-critical CDN: ML is a full client-side render whose price and
    # availability are injected by the http2.mlstatic.com JS bundle. Allow it as
    # a browser SUB-RESOURCE only (never a navigation target) so the page can
    # hydrate; without it the micro-landing shell never becomes the product page.
    subresource_domains:
      - http2.mlstatic.com
    parser:
      # MercadoLivre's rendered DOM is parsed by a dedicated adapter (single
      # price from <meta itemprop="price"> under id="price"); no locators here.
      kind: mercadolivre
