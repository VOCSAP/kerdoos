# Pick ONE profile per deployment (not meant to run side by side):
#   docker compose --profile slim up -d        # http + tls tiers only
#   docker compose --profile autonomous up -d  # + browser + uc_selenium tiers
#
# Secrets (session secret, SMTP) come from a local `.env` (gitignored, copy
# `env.example`). Default topology is ADR 0002's self-contained S-B: one
# uvicorn worker (--workers reads KERDOOS_WORKERS, see the Dockerfile CMD)
# running the intra-process digest evaluator. Raising KERDOOS_WORKERS also
# raises the real uvicorn worker count, and the evaluator's own workers>1
# guard then refuses in every one of those processes -- pair that change
# with KERDOOS_DIGEST_EVALUATOR_ENABLED=false and an external cron instead,
# never both on at once (breaks the scheduler's exactly-once guarantee).
# Every KERDOOS_* value below comes ONLY from `.env` (no `environment:`
# block here) so this coupling cannot be silently defeated by compose
# precedence -- the one thing that CAN still defeat it is an operator
# overriding `command:` on a service, which bypasses the Dockerfile CMD
# entirely; don't.
#
# Port 9222 (Chromium CDP) is never mapped and must stay that way. Port 8000
# is bound to loopback only -- put a reverse proxy in front for LAN access,
# do not widen this to "8000:8000" (that publishes on every interface,
# including any WAN/VPN one the host may have).

services:
  kerdoos-slim:
    profiles: ["slim"]
    build:
      context: .
      target: slim
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - kerdoos-data:/data
    ports:
      - "127.0.0.1:8000:8000"

  kerdoos-autonomous:
    profiles: ["autonomous"]
    build:
      context: .
      target: autonomous
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    volumes:
      - kerdoos-data:/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  kerdoos-data:
